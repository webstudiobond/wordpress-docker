pid /tmp/angie.pid;
error_log /proc/self/fd/2 warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/angie/mime.types;
    default_type application/octet-stream;

    # Access logging is disabled internally; handled centrally by external Edge Angie
    access_log off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Up to 256M uploads buffered to disk (matching PHP max filesize)
    client_max_body_size 256M;
    client_body_buffer_size 512k;
    client_body_temp_path /var/www/tmp 1 2;

    proxy_temp_path /tmp/angie_proxy;
    fastcgi_temp_path /tmp/angie_fastcgi;
    uwsgi_temp_path /tmp/angie_uwsgi;
    scgi_temp_path /tmp/angie_scgi;

    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
    fastcgi_busy_buffers_size 64k;
    fastcgi_temp_file_write_size 64k;
    fastcgi_connect_timeout 60s;
    fastcgi_send_timeout 300s;
    fastcgi_read_timeout 300s;

    # Trust incoming real IP headers from Docker bridge / edge proxy networks
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    map $http_x_forwarded_proto $fastcgi_https {
        default off;
        https on;
    }

    # Optional HTTP-level includes from conf.d (ordered as in sb_wordpress.stpl)
    include /etc/angie/conf.d/limit_zones[.]conf;
    include /etc/angie/conf.d/nginx-map[.]conf;
    include /etc/angie/conf.d/wphide-firewall-nginx[.]conf;

    server {
        listen 80 default_server;
        server_name _ localhost 127.0.0.1 "";

        location /healthz {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }

        location / {
            return 444;
        }
    }

    server {
        listen 80;
        server_name ~^(?!127\.0\.0\.1|localhost).+$;

        # IP allow/deny rules
        include /etc/angie/conf.d/allow-deny-nginx[.]conf;

        root /var/www/html;
        index index.php index.html index.htm;

        location = /favicon.ico {
            log_not_found off;
            access_log off;
        }

        location = /robots.txt {
            try_files $uri $uri/ /index.php?$args;
            log_not_found off;
            access_log off;
        }

        location ~ /.*main-sitemap\.xsl$ {
            alias /var/www/html/main-sitemap.xsl;
        }

        # Block hidden files (.git, .env, .htaccess, etc.)
        location ~ /\.(?!well-known\/) {
            deny all;
            return 404;
        }

        # Hardened core files protection
        location ~* ^/(readme\.html|license\.txt|wp-config.*\.php) {
            deny all;
            return 404;
        }

        # Rocket-Nginx configuration
        include /etc/angie/conf.d/rocket-nginx[.]conf;

        # WP Hide
        include /etc/angie/conf.d/wphide-nginx[.]conf;

        location / {
            # include blockbots.conf
            include /etc/angie/conf.d/blockbots[.]conf;

            # include limit_req
            include /etc/angie/conf.d/limit_all[.]conf;

            try_files $uri $uri/ /index.php?$args;

            # include avif.conf
            include /etc/angie/conf.d/avif[.]conf;

            # include webp.conf
            include /etc/angie/conf.d/webp[.]conf;

            # include cache configuration file
            include /etc/angie/conf.d/cache[.]conf;

            location ~* ^.+\.(ogg|ogv|svg|svgz|swf|eot|otf|woff|woff2|mov|mp3|mp4|webm|flv|ttf|rss|atom|jpg|jpeg|gif|png|webp|avif|ico|bmp|mid|midi|wav|rtf|css|js|jar)$ {
                expires max;
                fastcgi_hide_header "Set-Cookie";
                log_not_found off;
                access_log off;
                add_header Cache-Control "public, max-age=31536000, immutable";
            }

            # Terminate script execution inside upload paths
            location ~* /(?:uploads|files)/.*\.(php|phtml|phar|sh|pl|py|cgi)$ {
                deny all;
                return 404;
            }

            location ~ [^/]\.php(/|$) {
                try_files $uri =404;

                include /etc/angie/fastcgi_params;

                fastcgi_index index.php;
                fastcgi_param HTTP_EARLY_DATA $http_early_data if_not_empty;
                fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                fastcgi_param HTTPS $fastcgi_https;

                fastcgi_pass unix:/var/run/sockets/php-fpm.sock;

                include /etc/angie/conf.d/fastcgi_cache[.]conf;
                include /etc/angie/conf.d/nginx.fastcgi_cache[.]conf;

                # POST requests and urls with a query string should always go to PHP
                if ($request_method = POST) {
                    set $no_cache 1;
                }
                if ($query_string != "") {
                    set $no_cache 1;
                }

                if ($request_uri ~* "/wp-admin/|/wp-json/|wp-.*.php|xmlrpc.php|index.php|/store.*|/cart.*|/my-account.*|/checkout.*") {
                    set $no_cache 1;
                }

                if ($http_cookie ~* "comment_author|wordpress_[a-f0-9]+|wp-postpass|wordpress_no_cache|wordpress_logged_in|woocommerce_items_in_cart|woocommerce_cart_hash|PHPSESSID") {
                    set $no_cache 1;
                }

                add_header X-FastCGI-Cache $upstream_cache_status;

                # WP Hide security headers
                include /etc/angie/conf.d/wphide-nginx-secyrity-headers[.]conf;
                include /etc/angie/conf.d/wphide-nginx-security-headers[.]conf;
            }

            # fastcgi_cache_purge
            include /etc/angie/conf.d/fastcgi_cache_purge[.]conf;
        }

        # include Redirect configuration file
        include /etc/angie/conf.d/redirect[.]conf;

        # include the Security configuration file
        include /etc/angie/conf.d/security[.]conf;

        # include W3TC configuration file (generated by plugin in web root)
        include /var/www/html/nginx[.]conf;
    }
}
