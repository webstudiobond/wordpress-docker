pid /tmp/angie.pid;
error_log /proc/self/fd/2 warn;
include /etc/angie/modules.conf;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/angie/mime.types;
    default_type application/octet-stream;

    # Access logging is disabled internally; handled centrally by external Edge Angie
    access_log off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Up to 256M uploads buffered to disk (matching PHP max filesize)
    client_max_body_size 256M;
    client_body_buffer_size 512k;
    client_body_temp_path /var/www/tmp 1 2;

    proxy_temp_path /tmp/angie_proxy;
    fastcgi_temp_path /tmp/angie_fastcgi;
    uwsgi_temp_path /tmp/angie_uwsgi;
    scgi_temp_path /tmp/angie_scgi;

    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
    fastcgi_busy_buffers_size 64k;
    fastcgi_temp_file_write_size 64k;
    fastcgi_connect_timeout 60s;
    fastcgi_send_timeout 300s;
    fastcgi_read_timeout 300s;

    # Trust incoming real IP headers from Docker bridge / edge proxy networks
    set_real_ip_from 172.20.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    map $http_x_forwarded_proto $fastcgi_https {
        default off;
        https on;
    }

    # Native Next-Gen image formats mapping (AVIF / WebP)
    map $http_accept $webp_suffix {
        default "";
        "~*webp" ".webp";
    }
    map $http_accept $avif_suffix {
        default "";
        "~*avif" ".avif";
    }

    # FastCGI cache exclusions mapping (clean replacement for nested "if" statements)
    map $request_method $no_cache_method {
        default 0;
        POST    1;
    }

    map $query_string $no_cache_query {
        default 1;
        ""      0;
    }

    map $request_uri $no_cache_uri {
        default 0;
        ~*^/(wp-admin/|wp-json/|wp-.*\.php|xmlrpc\.php|store.*|cart.*|my-account.*|checkout.*) 1;
    }

    map $http_cookie $no_cache_cookie {
        default 0;
        ~*(comment_author|wordpress_[a-f0-9]+|wp-postpass|wordpress_no_cache|wordpress_logged_in|woocommerce_items_in_cart|woocommerce_cart_hash|PHPSESSID) 1;
    }

    # Combined cache bypass flag: 0 = cache allowed, 1 = bypass cache
    map "$no_cache_method:$no_cache_query:$no_cache_uri:$no_cache_cookie" $no_cache {
        default   1;
        "0:0:0:0" 0;
    }

    # Optional HTTP-level includes from conf.d
    include /etc/angie/conf.d/limit_zones[.]conf;
    include /etc/angie/conf.d/nginx-map[.]conf;
    include /etc/angie/conf.d/firewall-7g[.]conf;

    server {
        listen 80 default_server;
        server_name _ localhost 127.0.0.1 "";

        location /healthz {
            access_log off;
            keepalive_timeout 0;
            default_type text/plain;
            return 200 "OK\n";
        }

        location / {
            return 444;
        }
    }

    server {
        listen 80;
        server_name ~^(?!127\.0\.0\.1|localhost).+$;

        root /var/www/html;
        index index.php index.html index.htm;

        # Universal baseline security headers
        add_header X-Download-Options "noopen";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header Permissions-Policy "accelerometer=(), gamepad=(), gyroscope=()";
        add_header Cross-Origin-Resource-Policy "cross-origin";
        add_header Cross-Origin-Opener-Policy "unsafe-none";
        add_header Cross-Origin-Embedder-Policy "unsafe-none";
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff";
        add_header X-Permitted-Cross-Domain-Policies "none";

        # Service static endpoints
        location = /favicon.ico {
            log_not_found off;
            access_log off;
        }

        location = /robots.txt {
            try_files $uri $uri/ /index.php?$args;
            log_not_found off;
            access_log off;
        }

        location ~ /.*main-sitemap\.xsl$ {
            alias /var/www/html/main-sitemap.xsl;
        }

        # 1. Block hidden files (.git, .env, .htaccess, etc.) while preserving well-known endpoints
        location ~ /\.(?!well-known\/) {
            deny all;
            return 404;
        }

        # 2. Hardened core files protection & XML-RPC
        location ~* ^/(readme\.html|license\.txt|wp-config.*\.php|xmlrpc\.php) {
            deny all;
            return 404;
        }

        # 3. Terminate script execution inside upload paths (strictly above .php handler)
        location ~* /(?:uploads|files)/.*\.(php|phtml|phar|sh|pl|py|cgi)$ {
            deny all;
            return 404;
        }

        # Optional cache & WAF plugins (WP Rocket, WP Hide, IP access rules)
        include /etc/angie/conf.d/rocket-nginx[.]conf;
        include /etc/angie/conf.d/wphide-nginx[.]conf;
        include /etc/angie/conf.d/allow-deny-access[.]conf;

        # 4. Images: automatic AVIF/WebP delivery with graceful original fallback
        location ~* ^(?<path>.+)\.(png|jpe?g)$ {
            add_header Vary Accept;
            add_header Cache-Control "public, max-age=31536000, immutable";
            expires max;
            log_not_found off;
            access_log off;
            try_files $uri$avif_suffix $uri$webp_suffix $uri =404;
        }

        # 5. Static assets: CSS, JS, fonts, media
        location ~* \.(css|js|woff|woff2|ttf|eot|otf|svg|svgz|ico|webp|avif|mp4|webm|ogg|mp3)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            expires max;
            log_not_found off;
            access_log off;
            try_files $uri =404;
        }

        # 6. Primary WordPress routing
        location / {
            include /etc/angie/conf.d/blockbots[.]conf;
            include /etc/angie/conf.d/limit_all[.]conf;

            try_files $uri $uri/ /index.php?$args;
        }

        # 7. PHP FastCGI processing
        location ~ [^/]\.php(/|$) {
            try_files $uri =404;

            include /etc/angie/fastcgi_params;

            fastcgi_index index.php;
            fastcgi_param HTTP_EARLY_DATA $http_early_data if_not_empty;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS $fastcgi_https;

            fastcgi_pass unix:/var/run/sockets/php-fpm.sock;

            include /etc/angie/conf.d/fastcgi_cache[.]conf;
            include /etc/angie/conf.d/nginx.fastcgi_cache[.]conf;

            add_header X-FastCGI-Cache $upstream_cache_status;

            # Specialized CSP rules for dynamic/authenticated PHP output
            include /etc/angie/conf.d/csp-dynamic-php[.]conf;
        }

        # Disallow prefetch-proxy user agent
        include /etc/angie/conf.d/prefetch-proxy[.]conf;

        # Custom redirects
        include /etc/angie/conf.d/redirect[.]conf;

        # Wordfence WAF protection
        include /etc/angie/conf.d/wordfence[.]conf;

        # W3 Total Cache configuration file (generated by plugin in web root)
        include /var/www/html/nginx[.]conf;
    }
}
