name: "${SITE_USER}"

services:
  mariadb:
    image: mariadb:${MARIADB_VERSION:-12.3}
    container_name: "${SITE_USER}_mariadb"
    hostname: "${SITE_USER}-mariadb"
    restart: always
    network_mode: "none"
    user: "${APP_UID}:${APP_GID}"
    read_only: true
    cap_drop:
      - ALL
    cap_add: []
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 50
    environment:
      MARIADB_DATABASE_FILE: /run/secrets/db_name
      MARIADB_USER_FILE: /run/secrets/db_user
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets:
      - db_name
      - db_user
      - db_password
      - db_root_password
    healthcheck:
      test: ["CMD-SHELL", "export MYSQL_PWD=\"$(cat /run/secrets/db_password)\"; mariadb-admin ping --socket=/var/run/sockets/mysql.sock --user=\"$(cat /run/secrets/db_user)\" --silent"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    tmpfs:
      - /run/mysqld:mode=0700,noexec,nosuid,nodev,size=16m
      - /tmp:mode=1777,noexec,nosuid,nodev,size=64m
    volumes:
      - sockets:/var/run/sockets
      - ./mariadb:/var/lib/mysql:rw,noexec,nosuid,nodev
      - ./config/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - /etc/localtime:/etc/localtime:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  valkey:
    image: valkey/valkey:${VALKEY_VERSION:-9-alpine}
    container_name: "${SITE_USER}_valkey"
    hostname: "${SITE_USER}-valkey"
    restart: always
    network_mode: "none"
    user: "${APP_UID}:${APP_GID}"
    read_only: true
    cap_drop:
      - ALL
    cap_add: []
    security_opt:
      - no-new-privileges:true
    mem_limit: 96m
    cpus: 0.5
    command: ["valkey-server", "/etc/valkey/valkey.conf"]
    healthcheck:
      test: ["CMD", "valkey-cli", "-s", "/var/run/sockets/valkey.sock", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid,nodev,size=64m
      - /data:mode=1777,noexec,nosuid,nodev,size=16m
    volumes:
      - sockets:/var/run/sockets
      - ./config/valkey/valkey.conf:/etc/valkey/valkey.conf:ro
      - /etc/localtime:/etc/localtime:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  init:
    image: wordpress-docker:dev
    container_name: "${SITE_USER}_init"
    restart: "no"
    user: "${APP_UID}:${APP_GID}"
    entrypoint: ["php", "/usr/local/bin/wp-sync.php"]
    environment:
      WP_CONTENT_DIR: ${WP_CONTENT_DIR:-wp-content}
    volumes:
      - ./${DATA_DIR:-data}:/var/www/html:rw
      - /etc/localtime:/etc/localtime:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  wordpress:
    build:
      context: .
      target: fpm
    image: wordpress-docker:dev
    container_name: "${SITE_USER}_wordpress"
    hostname: "${SITE_USER}-wordpress"
    restart: always
    user: "${APP_UID}:${APP_GID}"
    read_only: true
    cap_drop:
      - ALL
    cap_add: []
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 60
    environment:
      SITE_USER: "${SITE_USER}"
      WORDPRESS_DB_HOST: "localhost:/var/run/sockets/mysql.sock"
      WORDPRESS_DB_NAME_FILE: /run/secrets/db_name
      WORDPRESS_DB_USER_FILE: /run/secrets/db_user
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db_password
      WORDPRESS_TABLE_PREFIX_FILE: /run/secrets/table_prefix
      WORDPRESS_CONTENT_DIR: ${WP_CONTENT_DIR:-wp-content}
    env_file:
      - path: ./wordpress.env
        required: false
    secrets:
      - db_name
      - db_user
      - db_password
      - table_prefix
      - auth_key
      - secure_auth_key
      - logged_in_key
      - nonce_key
      - auth_salt
      - secure_auth_salt
      - logged_in_salt
      - nonce_salt
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid,nodev,size=64m
      - /run/php:mode=1777,noexec,nosuid,nodev,size=16m
    volumes:
      - sockets:/var/run/sockets
      - ./tmp:/var/www/tmp:rw,noexec,nosuid,nodev
      - ./${DATA_DIR:-data}:/var/www/html:rw
      - ./${DATA_DIR:-data}/${WP_CONTENT_DIR:-wp-content}/uploads:/var/www/html/${WP_CONTENT_DIR:-wp-content}/uploads:rw,noexec,nosuid,nodev
      - ./secrets:/etc/wordpress/secrets:ro
      - ./config/php/php-fpm.conf:/etc/php/${PHP_VERSION:-8.5}/fpm/php-fpm.conf:ro
      - ./config/php/php.ini:/etc/php/${PHP_VERSION:-8.5}/fpm/conf.d/99-custom.ini:ro
      - ./config/php/opcache.ini:/etc/php/${PHP_VERSION:-8.5}/fpm/conf.d/10-opcache.ini:ro
      - ./config/php/www.conf:/etc/php/${PHP_VERSION:-8.5}/fpm/pool.d/www.conf:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      init:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
      valkey:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  wp-cli:
    build:
      context: .
      target: cli
    image: wordpress-docker:dev-cli
    container_name: "${SITE_USER}_wp-cli"
    hostname: "${SITE_USER}-wp-cli"
    profiles:
      - tools
    restart: "no"
    user: "${APP_UID}:${APP_GID}"
    read_only: true
    cap_drop:
      - ALL
    cap_add: []
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    environment:
      SITE_USER: "${SITE_USER}"
      HOME: /var/www/.wp-cli
      WP_CLI_PACKAGES_DIR: /var/www/.wp-cli/packages
      WP_CLI_CACHE_DIR: /var/www/.wp-cli/cache
      COMPOSER_HOME: /var/www/.wp-cli/composer
      WORDPRESS_DB_HOST: "localhost:/var/run/sockets/mysql.sock"
      WORDPRESS_DB_NAME_FILE: /run/secrets/db_name
      WORDPRESS_DB_USER_FILE: /run/secrets/db_user
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db_password
      WORDPRESS_TABLE_PREFIX_FILE: /run/secrets/table_prefix
      WORDPRESS_CONTENT_DIR: ${WP_CONTENT_DIR:-wp-content}
    env_file:
      - path: ./wordpress.env
        required: false
    secrets:
      - db_name
      - db_user
      - db_password
      - table_prefix
      - auth_key
      - secure_auth_key
      - logged_in_key
      - nonce_key
      - auth_salt
      - secure_auth_salt
      - logged_in_salt
      - nonce_salt
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid,nodev,size=64m
      - /run/php:mode=1777,noexec,nosuid,nodev,size=16m
    volumes:
      - sockets:/var/run/sockets
      - ./tmp:/var/www/tmp:rw,noexec,nosuid,nodev
      - ./.wp-cli:/var/www/.wp-cli:rw,noexec,nosuid,nodev
      - ./${DATA_DIR:-data}:/var/www/html:rw
      - ./${DATA_DIR:-data}/${WP_CONTENT_DIR:-wp-content}/uploads:/var/www/html/${WP_CONTENT_DIR:-wp-content}/uploads:rw,noexec,nosuid,nodev
      - ./secrets:/etc/wordpress/secrets:ro
      - ./config/php/php.ini:/etc/php/${PHP_VERSION:-8.5}/cli/conf.d/99-custom.ini:ro
      - ./config/php/opcache.ini:/etc/php/${PHP_VERSION:-8.5}/cli/conf.d/10-opcache.ini:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      mariadb:
        condition: service_healthy
      valkey:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  db-bridge:
    image: alpine/socat:latest
    container_name: "${SITE_USER}_db_bridge"
    hostname: "${SITE_USER}-db-bridge"
    profiles:
      - tools
    restart: "no"
    user: "${APP_UID}:${APP_GID}"
    read_only: true
    cap_drop:
      - ALL
    cap_add: []
    security_opt:
      - no-new-privileges:true
    mem_limit: 32m
    cpus: 0.2
    command: ["TCP4-LISTEN:3306,fork,reuseaddr", "UNIX-CONNECT:/var/run/sockets/mysql.sock"]
    ports:
      - "127.0.0.1:${DB_BRIDGE_PORT:-3307}:3306"
    volumes:
      - sockets:/var/run/sockets
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      mariadb:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  angie:
    image: docker.angie.software/angie:latest
    container_name: "${SITE_USER}_angie"
    hostname: "${SITE_USER}-angie"
    restart: always
    user: "${APP_UID}:${APP_GID}"
    read_only: true
    cap_drop:
      - ALL
    cap_add: []
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "-o", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    tmpfs:
      - /run/angie:mode=1777,noexec,nosuid,nodev,size=16m
      - /tmp:mode=1777,noexec,nosuid,nodev,size=64m
    volumes:
      - sockets:/var/run/sockets
      - ./${DATA_DIR:-data}:/var/www/html:ro
      - ./tmp:/var/www/tmp:rw,noexec,nosuid,nodev
      - ./config/angie/angie.conf:/etc/angie/angie.conf:ro
      - ./config/angie/modules.conf:/etc/angie/modules.conf:ro
      - ./config/angie/conf.d:/etc/angie/conf.d:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - frontend_gateway
    depends_on:
      wordpress:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

secrets:
  db_name:
    file: ./secrets/db_name.txt
  db_user:
    file: ./secrets/db_user.txt
  db_password:
    file: ./secrets/db_password.txt
  db_root_password:
    file: ./secrets/db_root_password.txt
  table_prefix:
    file: ./secrets/table_prefix.txt
  auth_key:
    file: ./secrets/auth_key.txt
  secure_auth_key:
    file: ./secrets/secure_auth_key.txt
  logged_in_key:
    file: ./secrets/logged_in_key.txt
  nonce_key:
    file: ./secrets/nonce_key.txt
  auth_salt:
    file: ./secrets/auth_salt.txt
  secure_auth_salt:
    file: ./secrets/secure_auth_salt.txt
  logged_in_salt:
    file: ./secrets/logged_in_salt.txt
  nonce_salt:
    file: ./secrets/nonce_salt.txt

volumes:
  sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=16m,mode=0700,uid=${APP_UID:-1000},gid=${APP_GID:-1000},noexec,nosuid,nodev"

networks:
  frontend_gateway:
    external: true
